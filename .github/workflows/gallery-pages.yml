name: GIF gallery

on:
  push:
    branches: ['**']
    paths:
      - 'site/**'
      - 'data/**'
      - 'README*.md'
      - 'guides/**'
      - 'skills/**'
      - 'SOURCES.md'
      - '.github/workflows/gallery-pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'data/**'
      - 'README*.md'
      - 'guides/**'
      - 'skills/**'
      - 'SOURCES.md'
      - '.github/workflows/gallery-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GALLERY_BASE_PATH: /awesome-image-2-6-gif/

jobs:
  build:
    name: Build and verify desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Check out fixed gallery baseline
        if: github.ref == 'refs/heads/wechat-evidence'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 72de44bf9ee1354de5ed52d777c85954b55e1fa4
          path: .evidence/baseline
          persist-credentials: false
      - name: Check out fixed upstream gallery
        if: github.ref == 'refs/heads/wechat-evidence'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: freestylefly/awesome-gpt-image-2
          ref: 53d3927ee3c45f6c54a12d86aabcf5c921670e11
          path: .evidence/upstream
          persist-credentials: false
      - name: Build fixed comparison snapshots
        if: github.ref == 'refs/heads/wechat-evidence'
        run: |
          (cd ../.evidence/baseline/site && npm ci --ignore-scripts && npm run build)
          (cd ../.evidence/upstream && npm ci --ignore-scripts && npm run build)
      - name: Verify in hosted Chrome
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/gallery-playwright
          GALLERY_SCREENSHOTS: ${{ runner.temp }}/gallery-screenshots
          GALLERY_URL: http://127.0.0.1:4173/awesome-image-2-6-gif/
        run: |
          npm install --prefix "$PLAYWRIGHT_DIR" --no-package-lock --no-save --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort --base "$GALLERY_BASE_PATH" > "$RUNNER_TEMP/gallery-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --silent --show-error --fail "$GALLERY_URL" > /dev/null
          node scripts/gallery-smoke.mjs
          if [ "$GITHUB_REF_NAME" = "wechat-evidence" ]; then
            (cd ../.evidence/baseline/site && exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4174 --strictPort --base "$GALLERY_BASE_PATH") > "$RUNNER_TEMP/gallery-baseline.log" 2>&1 &
            baseline_pid=$!
            (cd ../.evidence/upstream && exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4175 --strictPort) > "$RUNNER_TEMP/gallery-upstream.log" 2>&1 &
            upstream_pid=$!
            trap 'kill "$server_pid" "$baseline_pid" "$upstream_pid" 2>/dev/null || true' EXIT
            export GALLERY_BASELINE_URL="http://127.0.0.1:4174$GALLERY_BASE_PATH"
            export GALLERY_UPSTREAM_URL='http://127.0.0.1:4175/'
            for url in "$GALLERY_BASELINE_URL" "$GALLERY_UPSTREAM_URL"; do
              curl --retry 10 --retry-connrefused --retry-delay 1 --silent --show-error --fail "$url" > /dev/null
            done
            node scripts/gallery-benchmark.mjs
          fi
      - name: Upload desktop and mobile evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gallery-browser-evidence
          path: |
            ${{ runner.temp }}/gallery-screenshots
            ${{ runner.temp }}/gallery-vite.log
            ${{ runner.temp }}/gallery-baseline.log
            ${{ runner.temp }}/gallery-upstream.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure Pages
        if: github.repository == 'dongyu19920904/awesome-image-2-6-gif' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        if: github.repository == 'dongyu19920904/awesome-image-2-6-gif' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.repository == 'dongyu19920904/awesome-image-2-6-gif' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: gallery-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
